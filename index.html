<html>
    <head>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f7fc;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .container {
                text-align: center;
                padding: 20px;
                border: 2px solid #ddd;
                border-radius: 10px;
                background-color: #fff;
                width: 300px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            }
            h1 {
                color: #333;
            }
            label {
                font-size: 16px;
            }
            input[type="number"] {
                width: 80px;
                padding: 5px;
                margin: 10px;
                border-radius: 4px;
                border: 1px solid #ccc;
            }
            button {
                padding: 10px 20px;
                background-color: #4caf50;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
            }
            button:hover {
                background-color: #45a049;
            }
            .password-display input {
                margin-top: 20px;
                padding: 10px;
                width: 80%;
                font-size: 18px;
                border-radius: 4px;
                border: 1px solid #ccc;
                background-color: #f9f9f9;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Random Password Generator</h1>
            <label for="passwordLength">Password Length:</label>
            <input type="number" id="passwordLength" value="12" min="8" max="20" />
            <button id="generateButton">Generate Password</button>
            <div class="password-display">
                <input type="text" id="password" readonly />
            </div>
        </div>
                <script>
            function pass(length = 12) {
            const char = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%()_-+=";
            let password = "";
            for (let i = 0; i < length; i++) {
                const ind = Math.floor(Math.random() * char.length);
                password += char[ind];
            }
            return password;
        }
        const btn = document.getElementById("generateButton");
        const inp = document.getElementById("password");
        const passLen = document.getElementById("passwordLength");
        btn.addEventListener("click", () => {
            let length = parseInt(passLen.value, 10);
            if (length < 8)
                length = 8;
            if (length > 20)
                length = 20;
            const password = pass(length);
            inp.value = password;
        });
        //# sourceMappingURL=pass.js.map
        </script>
    </body>
</html>
